name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # tests/msw and tests/support hold the MSW fidelity contract and the
      # useCase() unknown-id guard — package.json's "test" script only runs
      # src, so these run nowhere else in CI.
      - name: Use-case harness
        run: npm run test:harness

      # Runs the use-case suite through the registry ratchet: enforced use
      # cases block, pending ones report without blocking. UC-C02 and UC-C04
      # are enforced; everything else is pending and reports coverage debt
      # without blocking.
      - name: Use cases
        run: npm run uc:check

      - name: Build
        run: npm run build

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ''
