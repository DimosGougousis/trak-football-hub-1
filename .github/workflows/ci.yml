name: CI

# Vercel's Git integration is disabled in vercel.json, so this workflow is the
# only route to a deployment. The `deploy` job needs `test`, which means no
# commit reaches Vercel — preview or production — unless the checks passed
# first.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ''

  # The `secrets` context is not available in a job-level `if`, so whether the
  # Vercel credentials exist has to be resolved in a job and passed on as an
  # output. Without this, a repo that has not yet added the secrets gets a red
  # Deploy job on every pull request instead of a clear skip.
  vercel-credentials:
    name: Check Vercel credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG" ] && [ -n "$PROJECT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployment skipped — Vercel credentials not configured"
              echo ""
              echo "\`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\` and \`VERCEL_PROJECT_ID\` must all be set"
              echo "as repository secrets under Settings → Secrets and variables → Actions."
              echo ""
              echo "**\`vercel.json\` disables Vercel's Git integration, so nothing is deploying"
              echo "at all until those secrets exist.**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy
    needs: [test, vercel-credentials]
    runs-on: ubuntu-latest
    # Skip rather than fail red when the credentials are absent, and on forked
    # pull requests, which cannot read secrets at all.
    if: >-
      needs.vercel-credentials.outputs.configured == 'true' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pulls project settings and environment variables from Vercel, so the
      # build gets VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY from the
      # Vercel project rather than from a file committed to the repo.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"
          {
            echo "### Deployed to ${{ steps.target.outputs.env }}"
            echo ""
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # Vercel's own PR comments stop once its Git integration is disabled, so
      # the preview URL is posted here instead.
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview-url -->';
            const body = `${marker}\n**Preview deployed:** ${url}\n\nChecks passed before this deployment was created.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
