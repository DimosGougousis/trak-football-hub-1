name: CI & Deploy

# Vercel's Git integration is disabled in vercel.json, so this workflow is the
# only route to a deployment. The `deploy` job needs `verify`, which means no
# commit reaches Vercel — preview or production — unless tests passed first.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the changed-file lint can diff against the base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The repo carries 53 pre-existing lint errors, mostly `any` on Supabase
      # results in files the pilot scope already condemns. Linting only what a
      # change touches makes the gate real today without a mass retyping, and
      # the debt can shrink but never grow. Removing this ratchet in favour of
      # a full `npm run lint` requires clearing that debt first.
      - name: Lint changed files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch with no previous commit — linting skipped."
            exit 0
          else
            RANGE="${{ github.event.before }}..HEAD"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$RANGE" -- '*.ts' '*.tsx')
          if [ -z "$FILES" ]; then
            echo "No TypeScript files changed."
            exit 0
          fi
          echo "Linting:"
          echo "$FILES"
          # shellcheck disable=SC2086
          npx eslint $FILES

      # Today this is the 34 lib/ unit tests. When the use-case harness lands
      # (docs/superpowers/specs/2026-09-07-use-case-test-harness-design.md),
      # `node scripts/uc-check.mjs --stage=ci` becomes an additional step here.
      - name: Test
        run: npm test

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    # Forked pull requests cannot read secrets, so skip rather than fail red.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pulls project settings and environment variables from Vercel, so the
      # build gets VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY from the
      # Vercel project rather than from a file committed to the repo.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"
          {
            echo "### Deployed to ${{ steps.target.outputs.env }}"
            echo ""
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # Vercel's own PR comments stop once its Git integration is disabled, so
      # the preview URL is posted here instead.
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview-url -->';
            const body = `${marker}\n**Preview deployed:** ${url}\n\nTests passed before this deployment was created.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
