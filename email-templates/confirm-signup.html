<!--
  Supabase -> Authentication -> Emails -> "Confirm signup".
  Kostas, 21 Oct: the same look as the invitation and sign-in emails, with a
  gap after the heading. Light on purpose: Gmail on mobile inverted the old
  dark version. Plain ASCII only: Gmail strips the charset, and raw Unicode
  arrived as mojibake ("Confirm email ,Uei").

  The link is token_hash, NOT .ConfirmationURL: that one carries a session and
  signs the person straight in, bypassing the password entirely. See
  src/pages/AuthConfirm.tsx.
-->
<div style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#111111;">
  <p style="font-size:18px;font-weight:700;letter-spacing:3px;margin:0 0 24px;">TRAK</p>
  <p style="font-size:17px;font-weight:600;margin:0 0 20px;">Confirm your email</p>
  <p style="font-size:15px;line-height:1.5;margin:0 0 12px;">Tap the button to activate your Trak account. You'll then sign in with the password you chose.</p>
  <p style="margin:16px 0 24px;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=signup" style="background:#C8F25A;color:#0A0A0B;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:600;display:inline-block;">Confirm email</a></p>
  <p style="font-size:12px;color:#666666;line-height:1.5;margin:24px 0 0;">If you didn't create a Trak account, ignore this email and nothing happens.</p>
  <p style="font-size:12px;color:#666666;line-height:1.5;margin:8px 0 0;">To keep Trak emails out of spam, add <strong>noreply@trakfootball.com</strong> to your contacts.</p>
</div>
