 class=\"cell\"><span class=\"b p2\">17<\u002Fspan><span class=\"b p2\">18<\u002Fspan><\u002Fdiv>\n        <div class=\"cell\">—<\u002Fdiv>\n        <div class=\"total\">4<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"dom\">Performance<\u002Fdiv>\n        <div class=\"cell\">—<\u002Fdiv>\n        <div class=\"cell\">—<\u002Fdiv>\n        <div class=\"cell\"><span class=\"b p2\">12<\u002Fspan><span class=\"b p2\">13<\u002Fspan><\u002Fdiv>\n        <div class=\"cell\"><span class=\"b p3\">24<\u002Fspan><\u002Fdiv>\n        <div class=\"total\">3<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"dom\">Fidelity / testing<\u002Fdiv>\n        <div class=\"cell\"><span class=\"b p0\">02<\u002Fspan><\u002Fdiv>\n        <div class=\"cell\"><span class=\"b p1\">06<\u002Fspan><\u002Fdiv>\n        <div class=\"cell\">—<\u002Fdiv>\n        <div class=\"cell\"><span class=\"b p3\">23<\u002Fspan><\u002Fdiv>\n        <div class=\"total\">3<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"dom\">Operations<\u002Fdiv>\n        <div class=\"cell\">—<\u002Fdiv>\n        <div class=\"cell\">—<\u002Fdiv>\n        <div class=\"cell\">—<\u002Fdiv>\n        <div class=\"cell\"><span class=\"b p3\">20<\u002Fspan><span class=\"b p3\">21<\u002Fspan><\u002Fdiv>\n        <div class=\"total\">2<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <div class=\"dom\">Accessibility &amp; business<\u002Fdiv>\n        <div class=\"cell\">—<\u002Fdiv>\n        <div class=\"cell\">—<\u002Fdiv>\n        <div class=\"cell\">—<\u002Fdiv>\n        <div class=\"cell\"><span class=\"b p3\">19<\u002Fspan><span class=\"b p3\">25<\u002Fspan><\u002Fdiv>\n        <div class=\"total\">2<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <aside class=\"legend\">\n      <h3>What this tells us<\u002Fh3>\n      <p><strong>Security and database items dominate the urgent tiers.<\u002Fstrong> Three of five P0 items live there — which means the people most likely to be busy this week are the backend lead and a security reviewer.<\u002Fp>\n      <p><strong>Operations and accessibility wait — but not forever.<\u002Fstrong> Both are entirely in P3. The cost of leaving them open is small during a 30-user pilot, large at the second customer.<\u002Fp>\n      <p><strong>The business model is the only strategy item.<\u002Fstrong> Item 25 is the one entry that won't be solved in the IDE.<\u002Fp>\n    <\u002Faside>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>Heatmap by domain<\u002Fdiv>\n    <div>18 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 22 — THIS WEEK'S SEQUENCE\n============================================================ -->\n<section data-label=\"22 This week sequence\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">Sequence · 19 / 25<\u002Fdiv>\n  <\u002Fdiv>\n\n  <style>\n    .seq-head { margin-top: 32px; max-width: 1500px; }\n    .seq-head h2 { font-family: \"Instrument Serif\", serif; font-weight: 400; font-size: 64px; line-height: 1.04; letter-spacing: -0.02em; margin-top: 18px; }\n    .seq-head h2 em { font-style: italic; color: var(--pitch); }\n    .seq-rail { margin-top: 48px; position: relative; padding: 0 0 16px; }\n    .seq-rail .axis { position: absolute; left: 0; right: 0; top: 60px; height: 2px; background: var(--line); }\n    .seq-rail .axis::before, .seq-rail .axis::after { content: \"\"; position: absolute; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--fg); }\n    .seq-rail .axis::before { left: -4px; }\n    .seq-rail .axis::after { right: -4px; }\n    .seq-steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 28px; position: relative; }\n    .seq-step { position: relative; padding-top: 110px; }\n    .seq-step .node { position: absolute; top: 44px; left: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--p0); color: #fff8f3; font-family: \"JetBrains Mono\", monospace; font-size: 24px; display: flex; align-items: center; justify-content: center; font-weight: 600; }\n    .seq-step .day { font-family: \"JetBrains Mono\", monospace; font-size: var(--type-tag); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-mute); }\n    .seq-step h4 { font-family: \"Instrument Serif\", serif; font-size: 38px; line-height: 1.1; letter-spacing: -0.01em; margin-top: 12px; }\n    .seq-step h4 em { font-style: italic; color: var(--pitch); }\n    .seq-step .note { margin-top: 16px; font-size: var(--type-small); color: var(--fg-soft); line-height: 1.4; }\n    .seq-foot { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding-top: 22px; border-top: 1px solid var(--line); }\n    .seq-foot .k { font-family: \"JetBrains Mono\", monospace; font-size: var(--type-tag); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-mute); }\n    .seq-foot .v { font-size: 26px; color: var(--fg); margin-top: 6px; line-height: 1.35; }\n  <\u002Fstyle>\n\n  <div class=\"seq-head\">\n    <div class=\"eyebrow\">This week · suggested order<\u002Fdiv>\n    <h2>Run the five P0 items <em>in this order.<\u002Fem> Each unblocks the next.<\u002Fh2>\n  <\u002Fdiv>\n\n  <div class=\"seq-rail\">\n    <div class=\"axis\"><\u002Fdiv>\n    <div class=\"seq-steps\">\n      <div class=\"seq-step\">\n        <div class=\"node\">1<\u002Fdiv>\n        <div class=\"day\">Mon<\u002Fdiv>\n        <h4>Audit <em>git history<\u002Fem>.<\u002Fh4>\n        <p class=\"note\">Cheapest, fastest, and the only one that has to land before any deploy. If keys leaked, today is the day to rotate.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"seq-step\">\n        <div class=\"node\">2<\u002Fdiv>\n        <div class=\"day\">Mon – Tue<\u002Fdiv>\n        <h4>Reconcile <em>STATE.md<\u002Fem>.<\u002Fh4>\n        <p class=\"note\">Gives the rest of the week an honest picture of what's actually done. Without it, every other item is guesswork.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"seq-step\">\n        <div class=\"node\">3<\u002Fdiv>\n        <div class=\"day\">Tue – Wed<\u002Fdiv>\n        <h4>Probe <em>RLS isolation<\u002Fem>.<\u002Fh4>\n        <p class=\"note\">Manual cross-tenant test in the browser. Surface every leak; tighten policy; codify as a test fixture.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"seq-step\">\n        <div class=\"node\">4<\u002Fdiv>\n        <div class=\"day\">Wed – Thu<\u002Fdiv>\n        <h4>Ship the <em>error boundary<\u002Fem>.<\u002Fh4>\n        <p class=\"note\">Global + per-route. Synthetic error in dev to confirm the fallback renders before merging.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"seq-step\">\n        <div class=\"node\">5<\u002Fdiv>\n        <div class=\"day\">Thu – Fri<\u002Fdiv>\n        <h4>Add <em>indexes<\u002Fem>.<\u002Fh4>\n        <p class=\"note\">Migrations on the three hot tables. EXPLAIN-verify the worst queries before close-of-week.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"seq-foot\">\n    <div>\n      <div class=\"k\">Outcome by Friday<\u002Fdiv>\n      <div class=\"v\">All five P0 items closed, owners signed off, evidence captured in the project tracker.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div class=\"k\">Friday review<\u002Fdiv>\n      <div class=\"v\">15-minute standup: confirm each item is done, decide whether to green-light the following Monday's pilot kickoff.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>This-week sequence<\u002Fdiv>\n    <div>19 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 23 — GREEN-LIGHT CONDITIONS\n============================================================ -->\n<section data-label=\"23 Green-light conditions\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">Decision · 20 / 25<\u002Fdiv>\n  <\u002Fdiv>\n\n  <style>\n    .gl { display: grid; grid-template-columns: 1fr 1.15fr; gap: 88px; padding-top: 40px; padding-bottom: 60px; height: 100%; align-items: center; }\n    .gl h2 { font-family: \"Instrument Serif\", serif; font-weight: 400; font-size: 96px; line-height: 1.0; letter-spacing: -0.02em; margin-top: 24px; }\n    .gl h2 em { font-style: italic; color: var(--pitch); }\n    .gl .lede { margin-top: 32px; font-size: var(--type-subtitle); color: var(--fg-soft); line-height: 1.3; max-width: 660px; }\n    .checks { display: grid; gap: 18px; }\n    .check { display: grid; grid-template-columns: 56px 1fr 130px; gap: 24px; align-items: center; padding: 26px 28px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 4px; }\n    .check .box { width: 36px; height: 36px; border-radius: 6px; border: 2px solid var(--fg); position: relative; }\n    .check .box::after { content: \"\"; position: absolute; left: 8px; top: 3px; width: 12px; height: 22px; border-right: 3px solid var(--pitch); border-bottom: 3px solid var(--pitch); transform: rotate(45deg); opacity: 0; }\n    .check.done .box::after { opacity: 1; }\n    .check .what { font-family: \"Instrument Serif\", serif; font-size: 32px; line-height: 1.15; font-style: italic; }\n    .check .who { font-family: \"JetBrains Mono\", monospace; font-size: var(--type-tag); color: var(--fg-soft); letter-spacing: 0.06em; text-transform: uppercase; text-align: right; }\n  <\u002Fstyle>\n\n  <div class=\"gl\">\n    <div>\n      <div class=\"eyebrow\">Green-light conditions<\u002Fdiv>\n      <h2>Pilot launches when <em>all five boxes<\u002Fem> are checked.<\u002Fh2>\n      <p class=\"lede\">Not before. Not partially. The boxes are deliberately small in number — each is binary, each has a named owner, and each is verifiable from outside the engineering team.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"checks\">\n      <div class=\"check\">\n        <div class=\"box\"><\u002Fdiv>\n        <div class=\"what\">Supabase keys verified clean (or rotated)<\u002Fdiv>\n        <div class=\"who\">Backend lead<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"check\">\n        <div class=\"box\"><\u002Fdiv>\n        <div class=\"what\">STATE.md reflects the running app<\u002Fdiv>\n        <div class=\"who\">Tech lead + PM<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"check\">\n        <div class=\"box\"><\u002Fdiv>\n        <div class=\"what\">RLS isolation passes the browser probe<\u002Fdiv>\n        <div class=\"who\">Security reviewer<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"check\">\n        <div class=\"box\"><\u002Fdiv>\n        <div class=\"what\">Error boundary live in prod<\u002Fdiv>\n        <div class=\"who\">Frontend lead<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"check\">\n        <div class=\"box\"><\u002Fdiv>\n        <div class=\"what\">Indexes deployed on three hot tables<\u002Fdiv>\n        <div class=\"who\">Backend lead<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>Green-light conditions<\u002Fdiv>\n    <div>20 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 24 — OPEN QUESTIONS FOR THE TEAM\n============================================================ -->\n<section data-label=\"24 Open questions\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">Open questions · 21 / 25<\u002Fdiv>\n  <\u002Fdiv>\n\n  <style>\n    .oq-head { margin-top: 32px; max-width: 1500px; }\n    .oq-head h2 { font-family: \"Instrument Serif\", serif; font-weight: 400; font-size: 64px; line-height: 1.04; letter-spacing: -0.02em; margin-top: 18px; }\n    .oq-head h2 em { font-style: italic; color: var(--pitch); }\n    .oq-grid { margin-top: 36px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 56px; }\n    .oq { display: grid; grid-template-columns: auto 1fr; gap: 24px; padding: 20px 0; border-top: 1px solid var(--line); }\n    .oq .q { font-family: \"JetBrains Mono\", monospace; font-size: var(--type-tag); color: var(--fg-mute); letter-spacing: 0.08em; padding-top: 6px; }\n    .oq .body { font-family: \"Instrument Serif\", serif; font-size: 30px; line-height: 1.18; letter-spacing: -0.005em; }\n    .oq .body em { font-style: italic; color: var(--pitch); }\n    .oq .body .ans { display: block; margin-top: 10px; font-family: \"Manrope\", sans-serif; font-style: normal; font-size: 24px; color: var(--fg-soft); line-height: 1.35; letter-spacing: 0; }\n  <\u002Fstyle>\n\n  <div class=\"oq-head\">\n    <div class=\"eyebrow\">For the team to answer<\u002Fdiv>\n    <h2>Six open questions <em>we cannot close from the codebase alone.<\u002Fem><\u002Fh2>\n  <\u002Fdiv>\n\n  <div class=\"oq-grid\">\n    <div class=\"oq\">\n      <div class=\"q\">Q1<\u002Fdiv>\n      <div class=\"body\">Who is the <em>single owner<\u002Fem> of the pilot launch decision?<span class=\"ans\">Each P0 item has a doer; only one person should hold the go / no-go.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"oq\">\n      <div class=\"q\">Q2<\u002Fdiv>\n      <div class=\"body\">How many <em>real users<\u002Fem> are we inviting in pilot week one?<span class=\"ans\">Index strategy and pagination thresholds depend on the actual cohort size.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"oq\">\n      <div class=\"q\">Q3<\u002Fdiv>\n      <div class=\"body\">What is the <em>incident path<\u002Fem> when a pilot user reports a crash on a Saturday?<span class=\"ans\">Without observability or on-call coverage, this is a quiet single point of failure.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"oq\">\n      <div class=\"q\">Q4<\u002Fdiv>\n      <div class=\"body\">Who owns <em>parental consent<\u002Fem> for the minors in scope — product, ops, or legal?<span class=\"ans\">Item 22 needs a named owner before pilot day one, not after.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"oq\">\n      <div class=\"q\">Q5<\u002Fdiv>\n      <div class=\"body\">What is our <em>working hypothesis<\u002Fem> on pricing — and when do we test it?<span class=\"ans\">Item 25 is the only entry we cannot answer from the IDE.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"oq\">\n      <div class=\"q\">Q6<\u002Fdiv>\n      <div class=\"body\">If two P0 items slip, do we <em>delay the pilot<\u002Fem> or shrink the cohort?<span class=\"ans\">Decide the rule now, while it's hypothetical and unemotional.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>Open questions for the team<\u002Fdiv>\n    <div>21 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 25 — CLOSE / DISCUSSION\n============================================================ -->\n<section data-label=\"25 Close\">\n  <style>\n    .close { position: absolute; inset: 0; background: var(--bg-dark); color: var(--bg); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); box-sizing: border-box; overflow: hidden; }\n    .close .pitch-bg { opacity: 0.35; }\n    .close .pitch-bg svg { stroke: #2c4a3b; stroke-width: 1.4; fill: none; }\n    .close .grid { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; }\n    .close .topstrip { display: flex; justify-content: space-between; font-family: \"JetBrains Mono\", monospace; font-size: var(--type-tag); letter-spacing: 0.06em; text-transform: uppercase; color: #aebcb3; }\n    .close .topstrip .mark { display: flex; align-items: center; gap: 14px; color: var(--bg); }\n    .close .topstrip .mark .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--pitch); box-shadow: 0 0 0 4px rgba(31,111,67,.22); }\n    .close .main { align-self: end; padding-bottom: 36px; }\n    .close .eyebrow { color: #8ea298; margin-bottom: 36px; }\n    .close h2 { font-family: \"Instrument Serif\", serif; font-weight: 400; font-size: 168px; line-height: 0.94; letter-spacing: -0.025em; color: var(--bg); max-width: 1500px; }\n    .close h2 em { font-style: italic; color: #5fb585; }\n    .close .lede { margin-top: 36px; font-size: 38px; line-height: 1.3; color: #aebcb3; max-width: 1200px; }\n    .close .botstrip { display: flex; justify-content: space-between; align-items: end; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.14); font-family: \"JetBrains Mono\", monospace; font-size: var(--type-small); letter-spacing: 0.06em; text-transform: uppercase; color: #aebcb3; }\n  <\u002Fstyle>\n\n  <div class=\"close\">\n    <div class=\"pitch-bg\" aria-hidden=\"true\">\n      <svg viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid slice\">\n        <rect x=\"40\" y=\"40\" width=\"1840\" height=\"1000\"><\u002Frect>\n        <line x1=\"960\" y1=\"40\" x2=\"960\" y2=\"1040\"><\u002Fline>\n        <circle cx=\"960\" cy=\"540\" r=\"140\"><\u002Fcircle>\n        <rect x=\"40\" y=\"280\" width=\"280\" height=\"520\"><\u002Frect>\n        <rect x=\"1600\" y=\"280\" width=\"280\" height=\"520\"><\u002Frect>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"grid\">\n      <div class=\"topstrip\">\n        <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n        <div>Discussion<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"main\">\n        <div class=\"eyebrow\">Discussion<\u002Fdiv>\n        <h2>Five blockers. <em>One week.<\u002Fem> Then we play.<\u002Fh2>\n        <p class=\"lede\">Thank you. Questions, dissent, and revised owner names all welcome — better here than on the pitch.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"botstrip\">\n        <div>Trak Football · Pre-Pilot Review<\u002Fdiv>\n        <div>25 / 25<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script type=\"application/json\" id=\"speaker-notes\">\n[\n  \"Welcome. This is the pre-pilot engineering review for Trak Football. I've been through the codebase end-to-end, and what I want to walk you through today is twenty-five specific things we should investigate, in priority order. The headline is encouraging: I think the pilot can launch — but only if we settle five specific items first. Everything else in this deck is about what we do after that, in week one, weeks two through four, and post-pilot. Plan for about twenty-five minutes plus questions.\",\n\n  \"Let me put the recommendation up front so the rest of the deck is in context. The pilot can launch, but it should not launch this week. Five P0 items have to clear first. They're listed here on the right. The pattern is consistent: these are the items where, if we get them wrong, a single pilot user can either see another user's data, brick the app for everyone, or trigger a performance regression we can't recover from at the table level. None of them are particularly hard. The work this week is mostly about confirming, not building. If we close these five, I'm confident green-lighting the pilot the following Monday.\",\n\n  \"Here's the full catalogue at a glance. Twenty-five items, sorted into four tiers. Five P0 blockers that have to land before any external user signs in. Six P1 items that we should close in launch week one — they don't block, but they become regret debt fast. Seven P2 items we monitor during the pilot itself, weeks two through four. And seven P3 items that need to close before we scale past the pilot — accessibility, CI, observability, the GDPR work, and the business model. The point of this slide is to set expectations on volume and timeline.\",\n\n  \"A quick orientation on how to read the rest of the deck. The P0 items each get their own slide, because every one of them is launch-blocking and I want time on each. The lower tiers are clustered by theme — so two slides for P1, two for P2, two for P3. Each item slide has the same structure: a verdict-style title, the original investigation question, why it matters, and a proposed owner and effort estimate. Item numbers match the source catalogue so you can use them in tickets after this meeting.\",\n\n  \"Now to P0. Five items. The framing for this section is simple: if any one of these is still open on launch day, we delay launch. Three of the five live in security or implementation fidelity — they're about confirming the foundation is what we think it is. The other two are operational gaps: an error boundary and database indexes. None of them are speculative; all five are concrete things to do this week.\",\n\n  \"P0 item one. The Supabase anon key — has it ever been committed to the repository? The command to check is on the slide. The reason this is urgent: a key that has ever been in git history is permanently public to anyone who has cloned, forked, or even shallow-pulled the repo at any point, regardless of whether we later scrubbed it. If it ever leaked, we rotate today. The good news is that the audit takes about two hours and the rotation is a redeploy. We also want to wire in a pre-commit secret scanner so we don't have to think about this again. The owner is the backend lead.\",\n\n  \"P0 item two. We have a conflict between STATE.md, which lists thirty-one tasks as pending, and the most recent commit message, which claims all six milestones are implemented. Until we know which is right, we don't actually know what we're shipping into the pilot. The fix is a half-day pair walk-through — tech lead and PM, sitting together, running the app and ticking each task as done, partial, broken, or not started. Then STATE.md becomes the source of truth, and we keep it current per merge. You cannot run a pilot on code you believe is complete; that's the line that matters here.\",\n\n  \"P0 item three. Multi-tenant isolation. We have RLS policies in place on every table, but we have never adversarially tested them. The probe is straightforward: sign in as Player A in one browser, open the Supabase client in the console, and try to read Player B's matches, assessments, profile, anything. If any row comes back, the policy is wrong. We do this for every table, fix what we find, and then codify each probe as a test fixture so we never regress. About three hours, owned by whoever's playing the security reviewer role this week.\",\n\n  \"P0 item four. There is no React error boundary anywhere in the app. The first time a pilot user triggers an unhandled exception — a corrupt match record, a date in the wrong format, a missing field — they get a blank white screen. And we will hear about it from them, not from logs. The fix is half a day: a global boundary at the router root with a graceful fallback, and per-route boundaries for the three role homes so one screen's crash doesn't take the app down with it. Frontend lead owns this. When the logging sink lands later in P3, we wire boundary errors into it.\",\n\n  \"P0 item five. Database indexes. Open Supabase Studio, look at the matches, coach_assessments, and squad_players tables, and confirm what I expect to be true: no indexes beyond the primary keys. Every list query is currently a full table scan. With thirty pilot users this is fine on day one and noticeably slow by week three. The fix is a half-day of migrations — foreign-key indexes on the obvious columns, plus a composite or two for the most common access patterns — and then re-running the worst three queries with EXPLAIN to confirm we're hitting indexes. Indexes are cheap to add before there's data and expensive once there is.\",\n\n  \"Recap of P0. Five items, four owners — the backend lead carries two, and PM partners with the tech lead on the STATE.md reconciliation. The total effort is comfortably under a person-week. The status column starts as 'open' across the board. By Friday, every row should read 'done', and we'd run a fifteen-minute review to confirm before green-lighting the following Monday's pilot kickoff.\",\n\n  \"Moving to P1. Six items, all hardening work that should close inside launch week one. These don't block launch — the app works without them — but they all become regret debt within a fortnight. I've split the six into two themed slides: cluster A is testing and types, cluster B is runtime safety. The headline for the section: P1 is the work that turns a working app into a production app.\",\n\n  \"P1 cluster A. Three items, all about confidence in what we ship. Item six: Playwright is already installed and configured. Zero test files exist. The smallest meaningful step is three end-to-end smoke tests, one per role's happy path, and we'd have them in a day. Item seven: TypeScript strict mode is off — no implicit any, no strict null checks, no unused variable checks. Turning it on surfaces the type debt today, while it's small. Item eleven is the ratchet: once seven is done, gate merges on a clean strict build so we can't slip backwards.\",\n\n  \"P1 cluster B. Three items about making the runtime honest. Item eight: every Supabase insert and update needs to check the error return and surface it to the user. The failure mode today is silent — coach assesses a player, request fails, UI says nothing, assessment is gone. We learn about it from the coach. Item nine: sessions expire, autoRefreshToken doesn't catch every case, and the app currently hangs instead of redirecting to sign-in. Add a global auth-state listener. Item ten: the password floor is six characters in both Supabase and the frontend. With minors in scope, it's eight. Two-line fix.\",\n\n  \"On to P2. Seven items to watch during the pilot weeks. The framing here is different from P0 and P1. These items are unlikely to fail on day one. They're the slow leaks — things that get worse as data accumulates, or that fail only on edge cases. So instead of 'fix before launch', the disposition is 'monitor weekly during the pilot, patch as needed'. Two themed slides: data integrity, then scale and UX.\",\n\n  \"P2 cluster A. Three items about treating data correctly. Item fourteen: our RLS policies use FOR ALL, which implicitly grants DELETE. A coach could erase their own assessment history; a player could delete a coach's record of them. Historical records should be immutable. We split the policies by verb. Item fifteen: the assessment band calculation takes six slider values. We've never tested it at boundary values — all zeros, all tens, mixed edges. Six fixtures, locked in as unit tests. Item sixteen: TRK invite codes have no unique constraint that I can see. Two coaches with the same code means players route to whichever account got there first. Quiet, hard to debug.\",\n\n  \"P2 cluster B. Four items about how the app behaves at scale and under stale state. Item twelve: no .range() in useMatches, so the history screen pulls everything every time. Add a cursor before someone tracks a full season. Item thirteen: measure the initial JS payload — twenty-four Radix components plus Recharts plus multiple icon sets will be felt on mobile. Item seventeen: PENDING_PROFILE_KEY in localStorage has no TTL, so abandoned onboarding state lives forever. Item eighteen: when we add the leaderboard, audit that aggregate queries don't let a player infer their coach or another player's club. Test before adding the feature, not after.\",\n\n  \"P3. Seven items to close before scaling beyond the pilot. The framing: each of these becomes urgent the moment we sign a second customer. They're not urgent today because we have one customer and thirty users. They will be urgent in three months. Two themed slides: quality and operations, then compliance and strategy.\",\n\n  \"P3 cluster A. Four items about operational maturity. Item nineteen: user-scalable=no in the viewport meta tag is a direct WCAG 1.4.4 violation. Run axe-core across the role homes and triage the rest. Accessibility for minors is not optional. Item twenty: there's no GitHub Actions workflow, so every deploy is a person clicking through Lovable. Single point of failure. Item twenty-one: three console.error calls across 132 files is effectively no observability. Pick Sentry, wire it into the error boundary from item four. Item twenty-three: Storybook is installed, stories were written against early scaffolding, they've drifted. Refresh or retire — stale stories are worse than no stories.\",\n\n  \"P3 cluster B. Three items that are not purely engineering. Item twenty-two: parental consent and account deletion are legal obligations for minors, full stop. We need a self-serve deletion path and a linked privacy policy. This one needs an owner outside engineering. Item twenty-four: tree-shake Recharts and audit our icon imports — wildcard imports likely add about two hundred kilobytes the bundle doesn't need. Item twenty-five: there is no documented monetization model anywhere in the project. The coach is identified as the acquisition channel, but no pricing, no conversion point, no paid tier is named. We need a working hypothesis before the pilot's last week so we can have the 'how much' conversation while the users are still engaged.\",\n\n  \"Here's where the work concentrates. Security carries five items across all four tiers — three urgent ones, which means the security reviewer and the backend lead are going to be the busiest people this week. Database is next with four, three of which are P2. Error handling, code quality, and fidelity each have three. Operations and accessibility wait entirely in P3 — fine for a pilot, urgent at customer two. The single business item is twenty-five, and it's the only entry that won't be answered in the IDE. The legend on the right summarizes what this distribution means for staffing.\",\n\n  \"Concretely for this week, here's the order I'd run the five P0 items in. Monday: the git history audit. It's the cheapest, the fastest, and the only one that has to land before any deploy. If keys leaked, we want to know on Monday. Monday into Tuesday: reconcile STATE.md, because the rest of the week is informed by that picture. Tuesday into Wednesday: the RLS probe. Wednesday into Thursday: ship the error boundary. Thursday into Friday: indexes. By Friday close, all five should be done, with evidence in the tracker. A fifteen-minute Friday review to confirm and to green-light Monday.\",\n\n  \"Green-light conditions for the pilot, all in one place. Five boxes. They're deliberately binary — checked or not, no halfway. Each has a named owner. Each is verifiable from outside the engineering team, which matters because the green-light decision is not just an engineering call. If on Friday any of these is unchecked, we don't launch on Monday. We don't ship 'mostly ready'. The conditions are small enough in number that 'mostly' isn't a real category.\",\n\n  \"Six open questions we cannot answer from the codebase. Who owns the launch decision singularly — because right now I see five doers but no single decision-maker. How many real users are in pilot week one — that sizing matters for indexes and pagination. What's the incident path on a Saturday — we don't have on-call coverage yet. Who owns parental consent — product, ops, or legal. What's our pricing hypothesis and when do we test it. And critically: if two P0 items slip on Friday, do we delay or shrink — better to decide the rule now, while it's hypothetical, than under pressure on Friday afternoon.\",\n\n  \"That's the review. Five blockers, one week, and then we play. I'm happy to take questions in any order — the items, the priorities, the owners, the timeline, or the open questions. Push back on anything that doesn't match the picture you have from the inside. Thank you.\"\n]\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
