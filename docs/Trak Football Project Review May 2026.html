document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

cover-strip .mark .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--pitch); box-shadow: 0 0 0 4px rgba(31,111,67,.22); }\n    .cover-main { align-self: end; padding-bottom: 24px; }\n    .cover-eyebrow { font-family: \"JetBrains Mono\", monospace; font-size: var(--type-tag); letter-spacing: 0.18em; text-transform: uppercase; color: #8ea298; margin-bottom: 36px; }\n    .cover-title { font-family: \"Instrument Serif\", serif; font-weight: 400; font-size: 168px; line-height: 0.94; letter-spacing: -0.025em; color: var(--bg); max-width: 1500px; }\n    .cover-title em { font-style: italic; color: #5fb585; }\n    .cover-foot { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 48px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,0.14); font-family: \"JetBrains Mono\", monospace; font-size: var(--type-small); letter-spacing: 0.04em; text-transform: uppercase; color: #aebcb3; }\n    .cover-foot .k { color: #6b7d72; font-size: var(--type-tag); margin-bottom: 6px; display: block; }\n    .cover-foot .v { color: var(--bg); }\n  <\u002Fstyle>\n  <div class=\"cover\">\n    <div class=\"pitch-bg\" aria-hidden=\"true\">\n      <svg viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid slice\">\n        <rect x=\"40\" y=\"40\" width=\"1840\" height=\"1000\"><\u002Frect>\n        <line x1=\"960\" y1=\"40\" x2=\"960\" y2=\"1040\"><\u002Fline>\n        <circle cx=\"960\" cy=\"540\" r=\"140\"><\u002Fcircle>\n        <circle cx=\"960\" cy=\"540\" r=\"4\" fill=\"#2c4a3b\"><\u002Fcircle>\n        <rect x=\"40\" y=\"280\" width=\"280\" height=\"520\"><\u002Frect>\n        <rect x=\"40\" y=\"420\" width=\"120\" height=\"240\"><\u002Frect>\n        <rect x=\"1600\" y=\"280\" width=\"280\" height=\"520\"><\u002Frect>\n        <rect x=\"1760\" y=\"420\" width=\"120\" height=\"240\"><\u002Frect>\n        <path d=\"M 40 460 A 100 100 0 0 1 40 620\"><\u002Fpath>\n        <path d=\"M 1880 460 A 100 100 0 0 0 1880 620\"><\u002Fpath>\n      <\u002Fsvg>\n >Tier P0 · Pre-pilot blockers<\u002Fspan><\u002Fdiv>\n        <h2>Five things must clear <em>before any pilot user signs in.<\u002Fem><\u002Fh2>\n        <p class=\"lede\">If one of these is still open on launch day, delay launch. These are not \"would be nice\" — they are the items that could expose user data, brick the app, or quietly degrade it to unusable inside the first week.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"botstrip\">\n        <div>Items 1 – 5<\u002Fdiv>\n        <div class=\"big\">5<\u002Fdiv>\n        <div>This week<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 06 — P0 #1 SECRETS IN GIT\n============================================================ -->\n<section data-label=\"06 P0-1 Secrets\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">P0 · Item 1 of 25 · Security<\u002Fdiv>\n  <\u002Fdiv>\n\n  <style>\n    .item { display: grid; grid-template-columns: 1fr 0.95fr; gap: 88px; padding-top: 56px; padding-bottom: 60px; height: 100%; align-items: start; }\n    .item .L { display: flex; flex-direction: column; gap: 32px; }\n    .item .chiprow { display: flex; align-items: center; gap: 18px; }\n    .item .num { font-family: \"JetBrains Mono\", monospace; font-size: var(--type-tag); color: var(--fg-mute); letter-spacing: 0.08em; text-transform: uppercase; }\n    .item .domain { font-family: \"JetBrains Mono\", monospace; font-size: var(--type-tag); color: var(--fg-soft); letter-spacing: 0.08em; text-transform: uppercase; }\n    .item .vline { width: 1px; height: 18px; background: var(--line); }\n    .item h2 { font-family: \"Instrument Serif\", serif; font-weight: 400; font-size: 82px; line-height: 1.0; letter-spacing: -0.02em; }\n    .item h2 em { font-style: italic; color: var(--pitch); }\n    .item .lede { font-size: var(--type-subtitle); color: var(--fg-soft); line-height: 1.3; max-width: 760px; }\n    .item .R { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 4px; padding: 40px; display: flex; flex-direction: column; gap: 28px; align-self: stretch; }\n    .item .R h3 { font-family: \"JetBrains Mono\", monospace; font-size: var(--type-tag); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-mute); }\n    .item .R .step { font-size: var(--type-small); line-height: 1.4; color: var(--fg); }\n    .item .R hr { border: none; border-top: 1px solid var(--line); margin: 8px 0; }\n    .item .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding-top: 18px; border-top: 1px solid var(--line); }\n    .item .meta .k { font-family: \"JetBrains Mono\", monospace; font-size: var(--type-tag); color: var(--fg-mute); letter-spacing: 0.08em; text-transform: uppercase; }\n    .item .meta .v { font-size: var(--type-small); color: var(--fg); margin-top: 6px; }\n    .item .ol { display: grid; gap: 16px; counter-reset: step; }\n    .item .ol li { display: grid; grid-template-columns: 40px 1fr; gap: 16px; align-items: baseline; font-size: var(--type-small); line-height: 1.4; counter-increment: step; }\n    .item .ol li > .t { display: block; }\n    .item .ol li::before { content: counter(step, decimal-leading-zero); font-family: \"JetBrains Mono\", monospace; color: var(--pitch); font-size: var(--type-tag); }\n  <\u002Fstyle>\n\n  <div class=\"item\">\n    <div class=\"L\">\n      <div class=\"chiprow\">\n        <span class=\"chip p0\"><span class=\"num\">P0<\u002Fspan><span>Blocker<\u002Fspan><\u002Fspan>\n        <span class=\"vline\"><\u002Fspan>\n        <span class=\"num\">Item 01<\u002Fspan>\n        <span class=\"vline\"><\u002Fspan>\n        <span class=\"domain\">Security<\u002Fspan>\n      <\u002Fdiv>\n      <h2>Confirm the Supabase key <em>has not entered git history<\u002Fem> — and rotate it if it has.<\u002Fh2>\n      <p class=\"lede\">Run <code>git log --all --full-history -- .env<\u002Fcode>. A single historical commit makes the anon key permanently public on any clone or fork, no matter how many later commits scrub it.<\u002Fp>\n      <div class=\"meta\">\n        <div><div class=\"k\">Owner<\u002Fdiv><div class=\"v\">Backend lead<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"k\">Effort<\u002Fdiv><div class=\"v\">~ 2 hours<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"k\">Due<\u002Fdiv><div class=\"v\">Before any deploy<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <aside class=\"R\">\n      <h3>How we'll resolve it<\u002Fh3>\n      <ol class=\"ol\">\n        <li><span class=\"t\">Audit history of <code>.env<\u002Fcode>, <code>.env.local<\u002Fcode>, and any committed config across <em>all<\u002Fem> branches and tags.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">If a key ever landed: rotate the anon and service keys in Supabase, redeploy.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Add <code>.env*<\u002Fcode> to <code>.gitignore<\u002Fcode> if absent; install a pre-commit secret scanner (gitleaks).<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Document the rotation procedure so we can repeat it without ceremony.<\u002Fspan><\u002Fli>\n      <\u002Fol>\n      <hr>\n      <div class=\"step\"><strong>Why now:<\u002Fstrong> rotating a key after a pilot user has signed in is a recovery exercise. Doing it now is a five-line config change.<\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>P0 · Item 1 — Secrets in git history<\u002Fdiv>\n    <div>04 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 07 — P0 #2 STATE.md vs CODE\n============================================================ -->\n<section data-label=\"07 P0-2 State vs code\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">P0 · Item 2 of 25 · Implementation fidelity<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"item\">\n    <div class=\"L\">\n      <div class=\"chiprow\">\n        <span class=\"chip p0\"><span class=\"num\">P0<\u002Fspan><span>Blocker<\u002Fspan><\u002Fspan>\n        <span class=\"vline\"><\u002Fspan>\n        <span class=\"num\">Item 02<\u002Fspan>\n        <span class=\"vline\"><\u002Fspan>\n        <span class=\"domain\">Implementation fidelity<\u002Fspan>\n      <\u002Fdiv>\n      <h2>Reconcile STATE.md against shipped code <em>before trusting either.<\u002Fem><\u002Fh2>\n      <p class=\"lede\">STATE.md lists all 31 tasks as \"pending\"; the most recent commit message says \"all 6 milestones implemented.\" Until we know which is right, we cannot scope the pilot — and we cannot estimate the remaining work.<\u002Fp>\n      <div class=\"meta\">\n        <div><div class=\"k\">Owner<\u002Fdiv><div class=\"v\">Tech lead + PM<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"k\">Effort<\u002Fdiv><div class=\"v\">½ day pair<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"k\">Due<\u002Fdiv><div class=\"v\">This week<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <aside class=\"R\">\n      <h3>How we'll resolve it<\u002Fh3>\n      <ol class=\"ol\">\n        <li><span class=\"t\">Pair walk the 31 task list against the running app, tagging each as <em>done · partial · broken · not started<\u002Fem>.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Re-write STATE.md so it reflects reality — once. Then keep it current per merge.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Promote any \"partial\" task back into the backlog with explicit acceptance criteria.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Flag anything that's drifted into \"implemented but not specified\" — those are tomorrow's bugs.<\u002Fspan><\u002Fli>\n      <\u002Fol>\n      <hr>\n      <div class=\"step\"><strong>Why now:<\u002Fstrong> you can't run a pilot on code you <em>believe<\u002Fem> is complete. The cost of finding out mid-pilot is a stakeholder conversation we don't want to have.<\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>P0 · Item 2 — STATE.md vs actual code<\u002Fdiv>\n    <div>05 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 08 — P0 #3 RLS ISOLATION\n============================================================ -->\n<section data-label=\"08 P0-3 RLS isolation\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">P0 · Item 3 of 25 · Security<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"item\">\n    <div class=\"L\">\n      <div class=\"chiprow\">\n        <span class=\"chip p0\"><span class=\"num\">P0<\u002Fspan><span>Blocker<\u002Fspan><\u002Fspan>\n        <span class=\"vline\"><\u002Fspan>\n        <span class=\"num\">Item 03<\u002Fspan>\n        <span class=\"vline\"><\u002Fspan>\n        <span class=\"domain\">Security · Multi-tenant<\u002Fspan>\n      <\u002Fdiv>\n      <h2>Break tenant isolation in the browser <em>before a pilot user does.<\u002Fem><\u002Fh2>\n      <p class=\"lede\">RLS policies exist on paper but have never been adversarially tested. Sign in as Player A, open the browser console, and try to read Player B's matches with the Supabase client directly. If anything comes back, the policy is wrong.<\u002Fp>\n      <div class=\"meta\">\n        <div><div class=\"k\">Owner<\u002Fdiv><div class=\"v\">Security reviewer<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"k\">Effort<\u002Fdiv><div class=\"v\">~ 3 hours<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"k\">Due<\u002Fdiv><div class=\"v\">This week<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <aside class=\"R\">\n      <h3>How we'll resolve it<\u002Fh3>\n      <ol class=\"ol\">\n        <li><span class=\"t\">Seed two players, two coaches, two clubs into a staging project.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Run the manual cross-tenant probe in the browser for <em>every<\u002Fem> table: matches, assessments, squad_players, profiles, invites.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">For every leak, tighten the policy and re-run. Codify each probe as a test fixture.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Keep a \"tenant isolation\" checklist alongside every future schema change.<\u002Fspan><\u002Fli>\n      <\u002Fol>\n      <hr>\n      <div class=\"step\"><strong>Why now:<\u002Fstrong> RLS is the only thing standing between Player A and Player B's data. We've never confirmed it actually does.<\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>P0 · Item 3 — RLS isolation<\u002Fdiv>\n    <div>06 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 09 — P0 #4 ERROR BOUNDARY\n============================================================ -->\n<section data-label=\"09 P0-4 Error boundary\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">P0 · Item 4 of 25 · Error handling<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"item\">\n    <div class=\"L\">\n      <div class=\"chiprow\">\n        <span class=\"chip p0\"><span class=\"num\">P0<\u002Fspan><span>Blocker<\u002Fspan><\u002Fspan>\n        <span class=\"vline\"><\u002Fspan>\n        <span class=\"num\">Item 04<\u002Fspan>\n        <span class=\"vline\"><\u002Fspan>\n        <span class=\"domain\">Error handling<\u002Fspan>\n      <\u002Fdiv>\n      <h2>Wrap the app in an error boundary <em>before a single bad input lands.<\u002Fem><\u002Fh2>\n      <p class=\"lede\">There is no React error boundary anywhere in the tree. The first unhandled exception from a pilot user blanks the entire screen — and we will hear about it from them, not from logs.<\u002Fp>\n      <div class=\"meta\">\n        <div><div class=\"k\">Owner<\u002Fdiv><div class=\"v\">Frontend lead<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"k\">Effort<\u002Fdiv><div class=\"v\">~ 4 hours<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"k\">Due<\u002Fdiv><div class=\"v\">This week<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <aside class=\"R\">\n      <h3>How we'll resolve it<\u002Fh3>\n      <ol class=\"ol\">\n        <li><span class=\"t\">Add a global error boundary at the router root with a graceful \"something broke, here's how to get back\" screen.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Add per-route boundaries for the three role homes so one screen's crash doesn't take the app with it.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Wire boundary errors into the logging sink (see P3 item 21) the moment that exists.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Trigger a synthetic error in dev to confirm the fallback actually renders.<\u002Fspan><\u002Fli>\n      <\u002Fol>\n      <hr>\n      <div class=\"step\"><strong>Why now:<\u002Fstrong> one corrupt match record from a pilot user shouldn't end their session — or our trial.<\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>P0 · Item 4 — Error boundary<\u002Fdiv>\n    <div>07 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 10 — P0 #5 DB INDEXES\n============================================================ -->\n<section data-label=\"10 P0-5 DB indexes\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">P0 · Item 5 of 25 · Database<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"item\">\n    <div class=\"L\">\n      <div class=\"chiprow\">\n        <span class=\"chip p0\"><span class=\"num\">P0<\u002Fspan><span>Blocker<\u002Fspan><\u002Fspan>\n        <span class=\"vline\"><\u002Fspan>\n        <span class=\"num\">Item 05<\u002Fspan>\n        <span class=\"vline\"><\u002Fspan>\n        <span class=\"domain\">Database · Performance<\u002Fspan>\n      <\u002Fdiv>\n      <h2>Add indexes <em>before thirty users hit a full table scan.<\u002Fem><\u002Fh2>\n      <p class=\"lede\">Open Supabase Studio and inspect indexes on <code>matches<\u002Fcode>, <code>coach_assessments<\u002Fcode>, and <code>squad_players<\u002Fcode>. Expectation: none exist beyond primary keys. Every list view is currently a full table scan.<\u002Fp>\n      <div class=\"meta\">\n        <div><div class=\"k\">Owner<\u002Fdiv><div class=\"v\">Backend lead<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"k\">Effort<\u002Fdiv><div class=\"v\">½ day with migrations<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"k\">Due<\u002Fdiv><div class=\"v\">This week<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <aside class=\"R\">\n      <h3>How we'll resolve it<\u002Fh3>\n      <ol class=\"ol\">\n        <li><span class=\"t\">Add a foreign-key index on <code>matches.player_id<\u002Fcode> and <code>matches.created_at<\u002Fcode> for history queries.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Index <code>coach_assessments.player_id<\u002Fcode> + composite on <code>(coach_id, created_at)<\u002Fcode>.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Index <code>squad_players.squad_id<\u002Fcode> and <code>squad_players.player_id<\u002Fcode> — both sides of the lookup.<\u002Fspan><\u002Fli>\n        <li><span class=\"t\">Re-run the worst three queries with EXPLAIN; confirm we're hitting indexes, not seq scans.<\u002Fspan><\u002Fli>\n      <\u002Fol>\n      <hr>\n      <div class=\"step\"><strong>Why now:<\u002Fstrong> indexes are cheap before there's data. They become a planned-migration conversation later.<\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>P0 · Item 5 — Database indexes<\u002Fdiv>\n    <div>08 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 11 — P0 RECAP & OWNERS\n============================================================ -->\n<section data-label=\"11 P0 Recap\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">P0 · Recap · 09 / 25<\u002Fdiv>\n  <\u002Fdiv>\n\n  <style>\n    .recap-head { margin-top: 32px; max-width: 1500px; }\n    .recap-head h2 { font-family: \"Instrument Serif\", serif; font-weight: 400; font-size: 64px; line-height: 1.02; letter-spacing: -0.02em; margin-top: 18px; }\n    .recap-head h2 em { font-style: italic; color: var(--pitch); }\n    .recap-table { margin-top: 32px; border-top: 1px solid var(--fg); }\n    .recap-table .hd, .recap-table .row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 130px 230px 100px 100px; gap: 20px; padding: 16px 8px; align-items: center; border-bottom: 1px solid var(--line); }\n    .recap-table .hd { font-family: \"JetBrains Mono\", monospace; font-size: var(--type-tag); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-mute); padding: 14px 8px; }\n    .recap-table .row { font-size: var(--type-small); color: var(--fg); }\n    .recap-table .row .n { font-family: \"JetBrains Mono\", monospace; color: var(--p0); font-weight: 600; font-size: var(--type-body); }\n    .recap-table .row .lbl { font-family: \"Instrument Serif\", serif; font-size: 26px; font-style: italic; line-height: 1.18; }\n    .recap-table .row .mono { font-family: \"JetBrains Mono\", monospace; font-size: 24px; color: var(--fg); }\n  <\u002Fstyle>\n\n  <div class=\"recap-head\">\n    <div class=\"eyebrow\">P0 · Recap<\u002Fdiv>\n    <h2>Five items, four owners, <em>one week<\u002Fem> to settle them all.<\u002Fh2>\n  <\u0  class=\"foot\">\n    <div>P0 — recap and owners<\u002Fdiv>\n    <div>09 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 12 — P1 SECTION HEADER\n============================================================ -->\n<section data-label=\"12 P1 Section\">\n  <div class=\"sec\">\n    <div class=\"pitch-bg\" aria-hidden=\"true\">\n      <svg viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid slice\">\n        <rect x=\"40\" y=\"40\" width=\"1840\" height=\"1000\"><\u002Frect>\n        <line x1=\"960\" y1=\"40\" x2=\"960\" y2=\"1040\"><\u002Fline>\n        <circle cx=\"960\" cy=\"540\" r=\"140\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"grid\">\n      <div class=\"topstrip\">\n        <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n        <div>P1 · Section opener<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"main\">\n        <div class=\"tier-lab\"><span class=\"swatch\" style=\"background: var(--p1)\"><\u002Fspan><span>Tier P1 · Hardening<\u002Fspan><\u002Fdiv>\n        <h2>Six items that should close <em>before the end of launch week.<\u002Fem><\u002Fh2>\n        <p class=\"lede\">P1 is what turns a working app into a production app: tests, types, error surfacing, session handling, and a basic password floor. None block launch — all become regret debt within a fortnight if we don't get to them.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"botstrip\">\n        <div>Items 6 – 11<\u002Fdiv>\n        <div class=\"big\">6<\u002Fdiv>\n        <div>Week 1<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 13 — P1 CLUSTER: TESTING & TYPES (6, 7, 11)\n============================================================ -->\n<section data-label=\"13 P1 Testing and types\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">P1 · Items 6, 7, 11 of 25 · Testing &amp; code quality<\u002Fdiv>\n  <\u002Fdiv>\n\n  <style>\n    .cluster-head { margin-top: 32px; max-width: 1400px; }\n    .cluster-head .row { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }\n    .cluster-head h2 { font-family: \"Instrument Serif\", serif; font-weight: 400; font-size: 60px; line-height: 1.05; letter-spacing: -0.02em; }\n    .cluster-head h2 em { font-style: italic; color: var(--p1); }\n    .cluster-grid { margin-top: 36px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }\n    .cl-card { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 4px; padding: 28px 28px; display: flex; flex-direction: column; gap: 14px; min-height: 380px; }\n    .cl-card .top { display: flex; align-items: center; gap: 14px; }\n    .cl-card .n { font-family: \"JetBrains Mono\", monospace; color: var(--p1); font-size: var(--type-tag); letter-spacing: 0.08em; }\n    .cl-card .dom { font-family: \"JetBrains Mono\", monospace; color: var(--fg-mute); font-size: var(--type-tag); letter-spacing: 0.08em; text-transform: uppercase; }\n    .cl-card h3 { font-family: \"Instrument Serif\", serif; font-size: 36px; line-height: 1.1; letter-spacing: -0.01em; }\n    .cl-card h3 em { font-style: italic; color: var(--p1); }\n    .cl-card .why { font-size: 24px; color: var(--fg-soft); line-height: 1.4; }\n    .cl-card .do { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); font-family: \"JetBrains Mono\", monospace; font-size: 24px; letter-spacing: 0.04em; color: var(--fg); }\n  <\u002Fstyle>\n\n  <div class=\"cluster-head\">\n    <div class=\"eyebrow\">P1 · Cluster A<\u002Fdiv>\n    <div class=\"row\"><span class=\"chip p1\"><span class=\"num\">P1<\u002Fspan><span>Hardening<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <h2>Stand up the test loop, the type loop, <em>and the strict-mode build<\u002Fem> the project already paid for.<\u002Fh2>\n  <\u002Fdiv>\n\n  <div class=\"cluster-grid\">\n    <article class=\"cl-card\">\n      <div class=\"top\"><span class=\"n\">Item 06<\u002Fspan><span class=\"dom\">· Testing<\u002Fspan><\u002Fdiv>\n      <h3>Stand up <em>the end-to-end<\u002Fem> test we already paid for.<\u002Fh3>\n      <p class=\"why\">Playwright is installed and configured but zero test files exist. The core player loop — sign up → log match → see band — has never been exercised end-to-end by anything other than a human.<\u002Fp>\n      <div class=\"do\">Action: 3 smoke tests covering each role's happy path.<\u002Fdiv>\n    <\u002Farticle>\n    <article class=\"cl-card\">\n      <div class=\"top\"><span class=\"n\">Item 07<\u002Fspan><span class=\"dom\">· Code quality<\u002Fspan><\u002Fdiv>\n      <h3>Turn TypeScript <em>strict mode on<\u002Fem> and pay the bill once.<\u002Fh3>\n      <p class=\"why\">noImplicitAny, strictNullChecks, and unused-variable checks are all disabled. Flipping them on surfaces the type debt today, while it's still small enough to fix.<\u002Fp>\n      <div class=\"do\">Action: enable strict in <code>tsconfig.app.json<\u002Fcode>; triage errors.<\u002Fdiv>\n    <\u002Farticle>\n    <article class=\"cl-card\">\n      <div class=\"top\"><span class=\"n\">Item 11<\u002Fspan><span class=\"dom\">· Code quality<\u002Fspan><\u002Fdiv>\n      <h3>Ship a build <em>that compiles clean<\u002Fem> under strict.<\u002Fh3>\n      <p class=\"why\">A build that only works with strict settings off is not production-grade. Once 07 is done, 11 is the ratchet that keeps it done — fail the pipeline on any new loose type.<\u002Fp>\n      <div class=\"do\">Action: <code>npm run build<\u002Fcode> in strict; gate merges on it.<\u002Fdiv>\n    <\u002Farticle>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>P1 · Cluster A — Testing &amp; types<\u002Fdiv>\n    <div>10 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 14 — P1 CLUSTER: RUNTIME SAFETY (8, 9, 10)\n============================================================ -->\n<section data-label=\"14 P1 Runtime safety\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">P1 · Items 8, 9, 10 of 25 · Runtime safety<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"cluster-head\">\n    <div class=\"eyebrow\">P1 · Cluster B<\u002Fdiv>\n    <div class=\"row\"><span class=\"chip p1\"><span class=\"num\">P1<\u002Fspan><span>Hardening<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <h2>Make every failure <em>visible to the user<\u002Fem> — and every weak password impossible.<\u002Fh2>\n  <\u002Fdiv>\n\n  <div class=\"cluster-grid\">\n    <article class=\"cl-card\">\n      <div class=\"top\"><span class=\"n\">Item 08<\u002Fspan><span class=\"dom\">· Error handling<\u002Fspan><\u002Fdiv>\n      <h3>Surface every Supabase <em>write failure<\u002Fem> to the user.<\u002Fh3>\n      <p class=\"why\">Audit every <code>.insert()<\u002Fcode> and <code>.update()<\u002Fcode> call. Silent failures mean a coach assesses a player, the request fails, the UI says nothing, and the assessment is gone. We learn about it from the coach.<\u002Fp>\n      <div class=\"do\">Action: lint rule + manual sweep; toast on every error path.<\u002Fdiv>\n    <\u002Farticle>\n    <article class=\"cl-card\">\n      <div class=\"top\"><span class=\"n\">Item 09<\u002Fspan><span class=\"dom\">· Error handling<\u002Fspan><\u002Fdiv>\n      <h3>Handle <em>the session that just expired<\u002Fem>.<\u002Fh3>\n      <p class=\"why\"><code>autoRefreshToken<\u002Fcode> is on, but no explicit expiry handler exists. Clear the token mid-session and the app hangs instead of redirecting cleanly to sign-in. Pilot users will hit this on the second day.<\u002Fp>\n      <div class=\"do\">Action: global auth-state listener; redirect on session loss.<\u002Fdiv>\n    <\u002Farticle>\n    <article class=\"cl-card\">\n      <div class=\"top\"><span class=\"n\">Item 10<\u002Fspan><span class=\"dom\">· Security<\u002Fspan><\u002Fdiv>\n      <h3>Raise the password floor <em>to eight characters<\u002Fem>.<\u002Fh3>\n      <p class=\"why\">Both Supabase and the frontend currently accept 6-character passwords. With minors in scope, the minimum is 8 and the message at signup should say so before the request goes out.<\u002Fp>\n      <div class=\"do\">Action: Supabase auth setting + frontend validator + copy.<\u002Fdiv>\n    <\u002Farticle>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>P1 · Cluster B — Runtime safety<\u002Fdiv>\n    <div>11 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 15 — P2 SECTION HEADER\n============================================================ -->\n<section data-label=\"15 P2 Section\">\n  <div class=\"sec\">\n    <div class=\"pitch-bg\" aria-hidden=\"true\">\n      <svg viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid slice\">\n        <rect x=\"40\" y=\"40\" width=\"1840\" height=\"1000\"><\u002Frect>\n        <line x1=\"960\" y1=\"40\" x2=\"960\" y2=\"1040\"><\u002Fline>\n        <circle cx=\"960\" cy=\"540\" r=\"140\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"grid\">\n      <div class=\"topstrip\">\n        <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n        <div>P2 · Section opener<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"main\">\n        <div class=\"tier-lab\"><span class=\"swatch\" style=\"background: var(--p2)\"><\u002Fspan><span>Tier P2 · Watch during the pilot<\u002Fspan><\u002Fdiv>\n        <h2>Seven items <em>to monitor<\u002Fem> while the pilot is live.<\u002Fh2>\n        <p class=\"lede\">P2 items are unlikely to break on day one but will accumulate quietly across the four weeks of the pilot. Pagination, data immutability, edge cases, and stale local state — each one becomes visible when something else goes wrong.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"botstrip\">\n        <div>Items 12 – 18<\u002Fdiv>\n        <div class=\"big\">7<\u002Fdiv>\n        <div>Weeks 2 – 4<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 16 — P2 CLUSTER: DATA INTEGRITY (14, 15, 16)\n============================================================ -->\n<section data-label=\"16 P2 Data integrity\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">P2 · Items 14, 15, 16 of 25 · Data integrity<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"cluster-head\">\n    <div class=\"eyebrow\">P2 · Cluster A<\u002Fdiv>\n    <div class=\"row\"><span class=\"chip p2\"><span class=\"num\">P2<\u002Fspan><span>Watch<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <h2>Treat assessment history <em>as a permanent record<\u002Fem> — and prove the maths at the edges.<\u002Fh2>\n  <\u002Fdiv>\n\n  <style>\n    .cluster-grid.p2 .cl-card h3 em { color: var(--p2); }\n    .cluster-grid.p2 .cl-card .n { color: var(--p2); }\n  <\u002Fstyle>\n\n  <div class=\"cluster-grid p2\">\n    <article class=\"cl-card\">\n      <div class=\"top\"><span class=\"n\">Item 14<\u002Fspan><span class=\"dom\">· Security<\u002Fspan><\u002Fdiv>\n      <h3>Lock down <em>FOR ALL<\u002Fem> RLS policies.<\u002Fh3>\n      <p class=\"why\">FOR ALL implicitly grants DELETE. A coach could erase their own assessment history; a player could delete a coach's record of them. Historical records should be immutable — split the policies by verb.<\u002Fp>\n      <div class=\"do\">Action: review each policy; replace ALL with SELECT/INSERT/UPDATE.<\u002Fdiv>\n    <\u002Farticle>\n    <article class=\"cl-card\">\n      <div class=\"top\"><span class=\"n\">Item 15<\u002Fspan><span class=\"dom\">· Database<\u002Fspan><\u002Fdiv>\n      <h3>Stress the band calculation <em>at its extremes<\u002Fem>.<\u002Fh3>\n      <p class=\"why\">Six sliders feed into the assessment band, and the boundary behaviour has never been tested. Submit with all-zeros, all-tens, and mixed-edge values — confirm the band that comes out is the one a human would expect.<\u002Fp>\n      <div class=\"do\">Action: 6 boundary fixtures, locked in as unit tests.<\u002Fdiv>\n    <\u002Farticle>\n    <article class=\"cl-card\">\n      <div class=\"top\"><span class=\"n\">Item 16<\u002Fspan><span class=\"dom\">· Database<\u002Fspan><\u002Fdiv>\n      <h3>Constrain invite codes <em>before two coaches collide<\u002Fem>.<\u002Fh3>\n      <p class=\"why\">No unique constraint is visible on <code>TRK-XXXX<\u002Fcode> invite codes. Two coaches sharing one code routes their players to whichever account got there first. Quiet, hard to debug, easy to prevent.<\u002Fp>\n      <div class=\"do\">Action: add UNIQUE constraint; retry-on-collision in generator.<\u002Fdiv>\n    <\u002Farticle>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>P2 · Cluster A — Data integrity<\u002Fdiv>\n    <div>13 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 17 — P2 CLUSTER: SCALE & UX (12, 13, 17, 18)\n============================================================ -->\n<section data-label=\"17 P2 Scale and UX\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">P2 · Items 12, 13, 17, 18 of 25 · Scale &amp; UX<\u002Fdiv>\n  <\u002Fdiv>\n\n  <style>\n    .quad-head { margin-top: 32px; max-width: 1500px; }\n    .quad-head .row { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }\n    .quad-head h2 { font-family: \"Instrument Serif\", serif; font-weight: 400; font-size: 54px; line-height: 1.05; letter-spacing: -0.02em; max-width: 1700px; }\n    .quad-head h2 em { font-style: italic; color: var(--p2); }\n    .quad-grid { margin-top: 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }\n    .quad { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 4px; padding: 26px 28px; display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: start; }\n    .quad .num { font-family: \"JetBrains Mono\", monospace; color: var(--p2); font-size: var(--type-tag); letter-spacing: 0.08em; width: 80px; padding-top: 4px; }\n    .quad h4 { font-family: \"Instrument Serif\", serif; font-size: 34px; line-height: 1.12; letter-spacing: -0.01em; }\n    .quad h4 em { font-style: italic; color: var(--p2); }\n    .quad .why { font-size: 24px; color: var(--fg-soft); line-height: 1.35; margin-top: 10px; }\n    .quad .domn { display: block; font-family: \"JetBrains Mono\", monospace; color: var(--fg-mute); font-size: 24px; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 12px; }\n  <\u002Fstyle>\n\n  <div class=\"quad-head\">\n    <div class=\"eyebrow\">P2 · Cluster B<\u002Fdiv>\n    <div class=\"row\"><span class=\"chip p2\"><span class=\"num\">P2<\u002Fspan><span>Watch<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <h2>Performance, bundle, stale state, leaderboard privacy — <em>the slow leaks.<\u002Fem><\u002Fh2>\n  <\u002Fdiv>\n\n  <div class=\"quad-grid\">\n    <div class=\"quad\">\n      <div class=\"num\">Item 12<\u002Fdiv>\n      <div>\n        <h4>Paginate match history <em>before it gets long.<\u002Fem><\u002Fh4>\n        <p class=\"why\">No <code>.range()<\u002Fcode> call is visible in <code>useMatches<\u002Fcode>. With 30+ matches per pilot player, the history screen pulls everything every time. Add a cursor and a \"load more\" before someone tracks a full season.<\u002Fp>\n        <span class=\"domn\">Performance<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"quad\">\n      <div class=\"num\">Item 13<\u002Fdiv>\n      <div>\n        <h4>Measure the <em>initial JS payload.<\u002Fem><\u002Fh4>\n        <p class=\"why\">24 Radix components, Recharts, multiple icon sets. Run <code>npm run build<\u002Fcode>, inspect <code>dist/<\u002Fcode>. Mobile pilot users on slow connections will feel anything over ~250KB of first-paint JS.<\u002Fp>\n        <span class=\"domn\">Performance<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"quad\">\n      <div class=\"num\">Item 17<\u002Fdiv>\n      <div>\n        <h4>Expire <em>stale onboarding state.<\u002Fem><\u002Fh4>\n        <p class=\"why\"><code>PENDING_PROFILE_KEY<\u002Fcode> has no expiry timestamp. If a user abandons onboarding and returns days later, they restart from a phantom mid-state. Stamp it with a TTL, or clear on every successful sign-in.<\u002Fp>\n        <span class=\"domn\">Code quality<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"quad\">\n      <div class=\"num\">Item 18<\u002Fdiv>\n      <div>\n        <h4>Audit <em>leaderboard privacy<\u002Fem> at aggregate level.<\u002Fh4>\n        <p class=\"why\">A position leaderboard queries across players. We need to verify that aggregate views never let a player infer which coach owns them, or which club another player belongs to. Test before adding the feature, not after.<\u002Fp>\n        <span class=\"domn\">Security<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>P2 · Cluster B — Scale &amp; UX<\u002Fdiv>\n    <div>14 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 18 — P3 SECTION HEADER\n============================================================ -->\n<section data-label=\"18 P3 Section\">\n  <div class=\"sec\">\n    <div class=\"pitch-bg\" aria-hidden=\"true\">\n      <svg viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid slice\">\n        <rect x=\"40\" y=\"40\" width=\"1840\" height=\"1000\"><\u002Frect>\n        <line x1=\"960\" y1=\"40\" x2=\"960\" y2=\"1040\"><\u002Fline>\n        <circle cx=\"960\" cy=\"540\" r=\"140\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"grid\">\n      <div class=\"topstrip\">\n        <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n        <div>P3 · Section opener<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"main\">\n        <div class=\"tier-lab\"><span class=\"swatch\" style=\"background: var(--p3)\"><\u002Fspan><span>Tier P3 · Pre-scale<\u002Fspan><\u002Fdiv>\n        <h2>Seven items to close <em>before scaling beyond the pilot.<\u002Fem><\u002Fh2>\n        <p class=\"lede\">P3 covers the work that converts a successful pilot into a product: accessibility, CI/CD, observability, GDPR, Storybook hygiene, bundle discipline, and the monetization model. Each becomes urgent the moment we sign a second customer.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"botstrip\">\n        <div>Items 19 – 25<\u002Fdiv>\n        <div class=\"big\">7<\u002Fdiv>\n        <div>Post-pilot<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 19 — P3 CLUSTER: QUALITY & OPS (19, 20, 21, 23)\n============================================================ -->\n<section data-label=\"19 P3 Quality and ops\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">P3 · Items 19, 20, 21, 23 of 25 · Quality &amp; operations<\u002Fdiv>\n  <\u002Fdiv>\n\n  <style>\n    .quad-grid.p3 .quad .num { color: var(--p3); }\n    .quad-grid.p3 .quad h4 em { color: var(--p3); }\n    .quad-head.p3 h2 em { color: var(--p3); }\n  <\u002Fstyle>\n\n  <div class=\"quad-head p3\">\n    <div class=\"eyebrow\">P3 · Cluster A<\u002Fdiv>\n    <div class=\"row\"><span class=\"chip p3\"><span class=\"num\">P3<\u002Fspan><span>Pre-scale<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <h2>Make the app accessible, the deploys repeatable, <em>the logs real,<\u002Fem> the stories honest.<\u002Fh2>\n  <\u002Fdiv>\n\n  <div class=\"quad-grid p3\">\n    <div class=\"quad\">\n      <div class=\"num\">Item 19<\u002Fdiv>\n      <div>\n        <h4>Restore accessibility <em>the viewport meta tag broke.<\u002Fem><\u002Fh4>\n        <p class=\"why\"><code>user-scalable=no<\u002Fcode> in <code>index.html<\u002Fcode> directly violates WCAG 1.4.4. Run axe-core across all three role homes and triage the rest. Accessibility for minors is not optional.<\u002Fp>\n        <span class=\"domn\">Accessibility<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"quad\">\n      <div class=\"num\">Item 20<\u002Fdiv>\n      <div>\n        <h4>Replace manual deploys <em>with a real pipeline.<\u002Fem><\u002Fh4>\n        <p class=\"why\">No <code>.github/workflows/<\u002Fcode> exists. Every deploy is a person clicking through Lovable. That's a single point of failure and an audit problem the moment a second engineer joins the project.<\u002Fp>\n        <span class=\"domn\">Operations<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"quad\">\n      <div class=\"num\">Item 21<\u002Fdiv>\n      <div>\n        <h4>Wire up logging — <em>three calls is not observability.<\u002Fem><\u002Fh4>\n        <p class=\"why\">Three <code>console.error<\u002Fcode> calls across 132 files is effectively zero visibility. Pick Sentry (or equivalent), wire it into the error boundary from item 04, and start every incident with data instead of a guess.<\u002Fp>\n        <span class=\"domn\">Operations<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"quad\">\n      <div class=\"num\">Item 23<\u002Fdiv>\n      <div>\n        <h4>Refresh Storybook <em>or retire it.<\u002Fem><\u002Fh4>\n        <p class=\"why\">Storybook v10 is installed; the stories were written against early scaffolding and have drifted. Either bring them current to the shipped components or remove the dependency. Stale stories are worse than no stories.<\u002Fp>\n        <span class=\"domn\">Testing<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>P3 · Cluster A — Quality &amp; operations<\u002Fdiv>\n    <div>16 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 20 — P3 CLUSTER: COMPLIANCE & STRATEGY (22, 24, 25)\n============================================================ -->\n<section data-label=\"20 P3 Compliance and strategy\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">P3 · Items 22, 24, 25 of 25 · Compliance &amp; strategy<\u002Fdiv>\n  <\u002Fdiv>\n\n  <style>\n    .cluster-grid.p3 .cl-card h3 em { color: var(--p3); }\n    .cluster-grid.p3 .cl-card .n { color: var(--p3); }\n    .cluster-head.p3 h2 em { color: var(--p3); }\n  <\u002Fstyle>\n\n  <div class=\"cluster-head p3\">\n    <div class=\"eyebrow\">P3 · Cluster B<\u002Fdiv>\n    <div class=\"row\"><span class=\"chip p3\"><span class=\"num\">P3<\u002Fspan><span>Pre-scale<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <h2>Build the deletion path <em>the minors regulation demands,<\u002Fem> trim the bundle, name the business model.<\u002Fh2>\n  <\u002Fdiv>\n\n  <div class=\"cluster-grid p3\">\n    <article class=\"cl-card\">\n      <div class=\"top\"><span class=\"n\">Item 22<\u002Fspan><span class=\"dom\">· Compliance<\u002Fspan><\u002Fdiv>\n      <h3>Build the <em>data-deletion path<\u002Fem> for minors.<\u002Fh3>\n      <p class=\"why\">The pilot involves minors. Parental consent and deletion rights are legal obligations, not nice-to-haves. We need a self-serve account deletion flow and a privacy policy linked from the app — both before pilot close.<\u002Fp>\n      <div class=\"do\">Action: deletion endpoint + linked privacy policy.<\u002Fdiv>\n    <\u002Farticle>\n    <article class=\"cl-card\">\n      <div class=\"top\"><span class=\"n\">Item 24<\u002Fspan><span class=\"dom\">· Performance<\u002Fspan><\u002Fdiv>\n      <h3>Tree-shake Recharts <em>and audit icon imports.<\u002Fem><\u002Fh3>\n      <p class=\"why\">A wildcard Recharts import adds ~200KB un-tree-shaken. Combined with multiple icon sets we already ship, the bundle is heavier than it needs to be. One afternoon of import discipline saves a perceptible amount on mobile.<\u002Fp>\n      <div class=\"do\">Action: switch to named imports; measure delta in <code>dist/<\u002Fcode>.<\u002Fdiv>\n    <\u002Farticle>\n    <article class=\"cl-card\">\n      <div class=\"top\"><span class=\"n\">Item 25<\u002Fspan><span class=\"dom\">· Business<\u002Fspan><\u002Fdiv>\n      <h3>Pick a monetization model <em>before the pilot ends.<\u002Fem><\u002Fh3>\n      <p class=\"why\">No monetization is documented anywhere in the project. The coach is identified as the acquisition channel — but no pricing, conversion point, or paid tier is named. We need a working hypothesis before the pilot's last week, so the next conversation with users includes \"how much\".<\u002Fp>\n      <div class=\"do\">Action: written pricing hypothesis + conversion moment.<\u002Fdiv>\n    <\u002Farticle>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>P3 · Cluster B — Compliance &amp; strategy<\u002Fdiv>\n    <div>17 / 25<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================\n     SLIDE 21 — DOMAIN HEATMAP\n============================================================ -->\n<section data-label=\"21 Domain heatmap\">\n  <div class=\"strip\">\n    <div class=\"mark\"><span class=\"dot\"><\u002Fspan><span>Trak Football<\u002Fspan><\u002Fdiv>\n    <div class=\"crumb\">Where the risk concentrates · 18 / 25<\u002Fdiv>\n  <\u002Fdiv>\n\n  <style>\n    .heat-head { margin-
